<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Promptora AI — Autonomous 3D World Builder{% endblock %}</title>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN with Custom Promptora Futuristic Theme -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        promptora: {
                            bg: '#0F1117',
                            card: '#1A1D26',
                            cardHover: '#212634',
                            border: '#2D3748',
                            blue: '#3B82F6',
                            purple: '#A855F7',
                            cyan: '#06B6D4',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Consolas', 'monospace'],
                    },
                    boxShadow: {
                        'glow-blue': '0 0 25px -4px rgba(59, 130, 246, 0.45)',
                        'glow-purple': '0 0 25px -4px rgba(168, 85, 247, 0.45)',
                        'glow-brand': '0 0 32px -4px rgba(59, 130, 246, 0.4), 0 0 18px -2px rgba(168, 85, 247, 0.35)',
                    }
                }
            }
        };
    </script>

    <!-- Three.js + OrbitControls Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        :root {
            --bg-charcoal: #0F1117;
            --bg-card: #1A1D26;
            --accent-blue: #3B82F6;
            --neon-purple: #A855F7;
            --soft-border: #2D3748;
        }

        body {
            background-color: #0F1117;
            color: #F1F5F9;
            background-image:
                radial-gradient(circle at 12% 18%, rgba(59, 130, 246, 0.09), transparent 32%),
                radial-gradient(circle at 88% 14%, rgba(168, 85, 247, 0.09), transparent 34%),
                linear-gradient(rgba(45, 55, 72, 0.14) 1px, transparent 1px),
                linear-gradient(90deg, rgba(45, 55, 72, 0.14) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
            background-position: 0 0, 0 0, -1px -1px, -1px -1px;
        }

        .glass-panel {
            background: rgba(26, 29, 38, 0.84);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid #2D3748;
        }

        .glass-input {
            background: rgba(15, 17, 23, 0.78);
            backdrop-filter: blur(12px);
            border: 1px solid #2D3748;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-input:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18), 0 0 24px -4px rgba(168, 85, 247, 0.3);
        }

        .btn-gradient-glow {
            background: linear-gradient(135deg, #3B82F6 0%, #6366F1 50%, #A855F7 100%);
            background-size: 200% 200%;
            transition: all 0.25s ease;
            box-shadow: 0 6px 24px -4px rgba(59, 130, 246, 0.5), 0 4px 16px -2px rgba(168, 85, 247, 0.4);
        }

        .btn-gradient-glow:hover:not(:disabled) {
            background-position: 100% 50%;
            transform: translateY(-1px);
            box-shadow: 0 10px 30px -3px rgba(59, 130, 246, 0.65), 0 6px 22px -2px rgba(168, 85, 247, 0.55);
        }

        .btn-gradient-glow:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-gradient-glow:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Custom subtle scrollbars */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: #0F1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #2D3748;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4A5568;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.85); opacity: 0.85; }
            70% { transform: scale(1.75); opacity: 0; }
            100% { transform: scale(1.75); opacity: 0; }
        }
        .animate-pulse-ring::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            background-color: currentColor;
            animation: pulse-ring 1.8s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-promptora-blue/30 selection:text-white">
    {% block content %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
