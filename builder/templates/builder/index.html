<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promptora — Autonomous 3D World Builder</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0e14;
            color: #e6e9f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .card {
            background: #131824;
            border: 1px solid #232b3d;
            border-radius: 14px;
            padding: 40px 48px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .4);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.8em;
            background: linear-gradient(90deg, #7f5cff, #00c2ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        p { color: #8b93a7; margin: 6px 0; }
        .badge {
            display: inline-block;
            margin-top: 14px;
            padding: 6px 14px;
            border-radius: 999px;
            background: #1a2131;
            border: 1px solid #2c3752;
            font-size: .85em;
            color: #9fe3a1;
        }
    </style>
</head>
<body>
    <div id="page-data" data-blender-found="{{ blender_found|yesno:'true,false' }}"
         data-blender-note="{{ blender_note }}" style="display:none;"></div>
    <div class="card">
        <h1>Promptora</h1>
        <p>Autonomous 3D World Builder</p>
        <span class="badge" id="blender-badge">Status: {{ app_version }}</span>
        <p id="blender-line" style="margin-top: 10px;"></p>

        <form id="demo-form" style="margin-top: 24px; text-align: left;">
            {% csrf_token %}
            <label for="prompt" style="font-size:.9em; color:#8b93a7;">Prompt (demo builds a cube scene; AI planning arrives in Milestone 5)</label>
            <div style="display:flex; gap:8px; margin-top:6px;">
                <input id="prompt" type="text" value="Create a demo scene with a glowing cube"
                       style="flex:1; background:#0b0e14; border:1px solid #2c3752; color:#e6e9f0; border-radius:8px; padding:10px 12px;">
                <button type="submit" id="generate-btn"
                        style="background:linear-gradient(90deg,#7f5cff,#00c2ff); border:none; color:#fff; border-radius:8px; padding:10px 18px; cursor:pointer; font-weight:600;">
                    Generate Scene
                </button>
            </div>
        </form>

        <div id="status" style="margin-top:18px; text-align:left; font-size:.9em; color:#8b93a7;"></div>
        <div id="result" style="margin-top:12px; text-align:left;"></div>
    </div>

    <script>
        const pageData = document.getElementById('page-data').dataset;
        const badge = document.getElementById('blender-badge');
        document.getElementById('blender-line').textContent =
            (pageData.blenderFound === 'true' ? 'Blender detected: ' : 'Blender NOT found: ') + pageData.blenderNote;
        badge.textContent = pageData.blenderFound === 'true' ? 'Pipeline ready' : 'Setup needed';
        badge.style.color = pageData.blenderFound === 'true' ? '#9fe3a1' : '#f0a35e';

        const form = document.getElementById('demo-form');
        const button = document.getElementById('generate-btn');
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            button.disabled = true;
            resultEl.innerHTML = '';
            statusEl.textContent = 'Starting job...';
            try {
                const response = await fetch('/api/generate/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': form.querySelector('[name=csrfmiddlewaretoken]').value,
                    },
                    body: JSON.stringify({ prompt: document.getElementById('prompt').value }),
                });
                const data = await response.json();
                if (!response.ok) {
                    showFailure(data.error + (data.instructions ? '\n\n' + data.instructions : ''));
                    return;
                }
                pollJob(data.job_id);
            } catch (error) {
                showFailure('Could not reach the server: ' + error);
            }
        });

        async function pollJob(jobId) {
            const response = await fetch('/api/job/' + jobId + '/status/');
            const job = await response.json();
            statusEl.textContent = 'Job ' + jobId + ' — status: ' + job.status + ' (' + (job.phase || 'waiting for update') + ')';
            if (job.status === 'queued' || job.status === 'running') {
                setTimeout(() => pollJob(jobId), 1500);
            } else if (job.status === 'success') {
                statusEl.textContent = 'Job ' + jobId + ' completed.';
                showResults(job);
                button.disabled = false;
            } else {
                showFailure(job.error_message || 'Unknown failure.');
                button.disabled = false;
            }
        }

        function showResults(job) {
            resultEl.innerHTML = '';
            if (job.result.objects && job.result.objects.length) {
                const p = document.createElement('p');
                p.textContent = 'Objects: ' + job.result.objects.join(', ');
                resultEl.appendChild(p);
            }
            if (job.result.render_url) {
                const img = document.createElement('img');
                img.src = job.result.render_url;
                img.alt = 'Scene preview render';
                img.style.cssText = 'max-width:100%; border-radius:10px; border:1px solid #2c3752; margin-top:8px;';
                resultEl.appendChild(img);
            }
            if (job.result.blend_url) {
                const a = document.createElement('a');
                a.href = job.result.blend_url;
                a.textContent = 'Download .blend file';
                a.className = 'badge';
                a.style.cssText = 'margin-top:10px; text-decoration:none; color:#9cc7fe; cursor:pointer;';
                resultEl.appendChild(a);
            }
        }

        function showFailure(message) {
            statusEl.textContent = '';
            const box = document.createElement('pre');
            box.style.cssText = 'white-space:pre-wrap; background:#2a1a1e; border:1px solid #5c2833; color:#f2a6bd; padding:12px; border-radius:10px; font-size:.85em;';
            box.textContent = message;
            resultEl.innerHTML = '';
            resultEl.appendChild(box);
        }
    </script>
</body>
</html>
